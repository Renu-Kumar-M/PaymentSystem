
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-v3
  template:
    metadata:
      labels:
        app: payment-v3
    spec:
      containers:
        - name: payment-v3
          image: renukumarm06/payment-system:v3
          ports:
            - containerPort: 5002
---
apiVersion: v1
kind: Service
metadata:
  name: payment-v3-service
spec:
  type: NodePort
  selector:
    app: payment-v3
  ports:
    - port: 5002
      targetPort: 5002
      nodePort: 30052
